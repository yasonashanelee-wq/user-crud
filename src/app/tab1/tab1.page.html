<ion-content class="ion-padding">

  <div class="app-header">

  <img
    src="assets/profile.jpg" alt="Profile"
    class="profile-image"
    alt="Profile"
  />

  <div class="header-text">
    <h1>CRAVE HOUSE</h1>
    <p>Food Management</p>
  </div>

</div>

  <ion-item>
    <ion-input
      label="Food Name"
      labelPlacement="floating"
      placeholder="Enter food name"
      [(ngModel)]="newFood.name">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-select
      label="Category"
      label-placement="floating"
      placeholder="Select category"
      [(ngModel)]="newFood.category">

      <ion-select-option value="Burger">
        Burger
      </ion-select-option>

      <ion-select-option value="Pizza">
        Pizza
      </ion-select-option>

      <ion-select-option value="Chicken">
        Chicken
      </ion-select-option>

      <ion-select-option value="Pasta">
        Pasta
      </ion-select-option>

      <ion-select-option value="Dessert">
        Dessert
      </ion-select-option>

      <ion-select-option value="Drinks">
        Drinks
      </ion-select-option>

    </ion-select>
  </ion-item>

  <ion-item>
    <ion-input
      type="number"
      label="Price"
      labelPlacement="floating"
      placeholder="Enter price"
      [(ngModel)]="newFood.price">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      type="number"
      label="Quantity"
      labelPlacement="floating"
      placeholder="Enter quantity"
      [(ngModel)]="newFood.quantity">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-textarea
      label="Description"
      labelPlacement="floating"
      placeholder="Enter food description"
      [(ngModel)]="newFood.description">
    </ion-textarea>
  </ion-item>

  <ion-button
    expand="block"
    (click)="addFood()">

    Add Food

  </ion-button>

</ion-content>
